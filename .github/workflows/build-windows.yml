# Builds Word Counter on a real Windows machine provided by GitHub, tests it,
# and publishes:  WordCounter-Setup-<version>.exe   (installer - the in-app Update button uses it)
# Get them from the "Releases" section of the repository page.

name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest huggingface_hub

      - name: Read version
        id: ver
        run: |
          $v = python -c "import wordcounter; print(wordcounter.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          $notes = (git log -1 --pretty=%s)
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          python -m pytest -q -rA 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }

      - name: Download the speech model (packed into the app)
        run: python tools/get_model.py

      - name: Build .exe with PyInstaller
        run: pyinstaller WordCounter.spec --noconfirm --clean

      - name: Self-test the built .exe
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--self-test","--report","$PWD\selftest-exe.txt" -Wait -PassThru
          Get-Content selftest-exe.txt
          foreach ($needle in "PySide6", "numpy", "soundcard", "faster-whisper", "Speech model", "Discord-only listening") {
            if (-not (Select-String -Path selftest-exe.txt -SimpleMatch $needle | Where-Object { $_.Line -like "✔*" })) {
              throw "Packaged app check failed: $needle"
            }
          }

      - name: Press "Start Listening" for every sound source (catches sound-system start-up errors)
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--listen-test","$PWD\ci-listen.json" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process $p -Force; throw "listen test hung" }
          if (-not (Test-Path ci-listen.json)) { Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40; throw "no listen report" }
          Get-Content ci-listen.json
          # build machines have no microphone, so "no microphone found" is expected here -
          # but the sound system itself must start
          $r = Get-Content ci-listen.json -Raw | ConvertFrom-Json
          if (-not $r.ok) {
            Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40
            throw "pressing Start failed for a sound source (crash, no answer, or sound system error)"
          }

      - name: Hearing test (a computer voice says the words, the app counts them)
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $voice.SetOutputToWaveFile("$PWD\ci-hear.wav", $fmt)
          $voice.Speak("Hey bro, how are you doing today? I think the pizza is ready.")
          $voice.Speak("No way, bro. That is crazy.")
          $voice.Speak("Bro, come over here and look at this. I ordered another pizza.")
          $voice.SetOutputToNull()
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--hear-test","$PWD\ci-hear.wav","$PWD\ci-hear.json","--words","`"bro,pizza,no way`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; throw "hearing test took too long" }
          if (-not (Test-Path ci-hear.json)) { Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40; throw "no hearing report" }
          Get-Content ci-hear.json
          $r = Get-Content ci-hear.json -Raw | ConvertFrom-Json
          "bro: $($r.counts.bro)/3   pizza: $($r.counts.pizza)/2   no way: $($r.counts.'no way')/1"
          if ($r.counts.bro -lt 3 -or $r.counts.pizza -lt 2 -or $r.counts.'no way' -lt 1) { throw "the app didn't count the words well enough" }

      - name: Hearing test with the downloadable "Better" model
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--hear-test","$PWD\ci-hear.wav","$PWD\ci-hear-better.json","--words","`"bro,pizza,no way`"","--model","better" -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process $p -Force; throw "Better model test took too long" }
          if (-not (Test-Path ci-hear-better.json)) { Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40; throw "no report for the Better model" }
          Get-Content ci-hear-better.json
          $r = Get-Content ci-hear-better.json -Raw | ConvertFrom-Json
          if ($r.counts.bro -lt 3 -or $r.counts.pizza -lt 2) { throw "Better model didn't count the words" }

      - name: Graphics card support - download + load NVIDIA's libraries (only when asked)
        if: contains(github.event.head_commit.message, '[gpu-test]')
        timeout-minutes: 15
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--gpu-test","$PWD\ci-gpu.json" -PassThru
          if (-not $p.WaitForExit(800000)) { Stop-Process $p -Force; throw "GPU test took too long" }
          if (-not (Test-Path ci-gpu.json)) { Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40; throw "no GPU report" }
          Get-Content ci-gpu.json
          $r = Get-Content ci-gpu.json -Raw | ConvertFrom-Json
          if ($r.error) { throw "graphics card download failed: $($r.error)" }
          foreach ($d in "cublas64_12.dll", "cudnn64_9.dll") { if ($r.dll_loads.$d -ne "ok") { throw "$d won't load: $($r.dll_loads.$d)" } }

      - name: Picture of the window
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--screenshot","$PWD\window.png","--quit-after","3" -Wait -PassThru
          if (-not (Test-Path window.png)) { Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 40; throw "window did not open" }
          if (-not (Test-Path window-milestone.png)) { throw "milestone pop-up did not show" }

      - name: Can the app hear sound devices (info only - build machines have none)
        continue-on-error: true
        run: |
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--quit-after","4" -Wait -PassThru
          Get-Content "$env:APPDATA\WordCounter\app.log" -Tail 15

      - name: Hear just one app (like Discord) - needs a sound device, info only
        continue-on-error: true
        run: |
          $player = Start-Process powershell -ArgumentList "-NoProfile","-Command","`$p = New-Object System.Media.SoundPlayer '$PWD\ci-hear.wav'; try { `$p.PlayLooping() } catch { }; Start-Sleep 40" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $exe = "dist\WordCounter\WordCounter.exe"
          $p = Start-Process $exe -ArgumentList "--app-audio-probe",$player.Id,"$PWD\ci-app-audio.json" -PassThru
          $done = $p.WaitForExit(30000)
          "probe finished: $done"
          if (Test-Path ci-app-audio.json) { Get-Content ci-app-audio.json } else { "no report" }
          Stop-Process $player -Force -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path "$default\ISCC.exe") { $env:PATH += ";$default" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";$default" }
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\installer.iss

      - name: Test silent install
        run: |
          $setup = Get-ChildItem Output\WordCounter-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "installer did not finish" }
          $dir = "$env:LOCALAPPDATA\Programs\Word Counter"
          if (-not (Test-Path "$dir\WordCounter.exe")) { throw "install failed" }
          $r = Start-Process "$dir\WordCounter.exe" -ArgumentList "--self-test","--report","$PWD\selftest-installed.txt" -Wait -PassThru
          Get-Content selftest-installed.txt
          if ($r.ExitCode -ne 0) { throw "installed app self-test failed" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller - the Update button would not work" }

      - name: Test an in-app style update (silent reinstall + automatic restart)
        timeout-minutes: 6
        run: |
          $setup = Get-ChildItem Output\WordCounter-Setup-*.exe | Select-Object -First 1
          $dir = "$env:LOCALAPPDATA\Programs\Word Counter"
          $app = Start-Process "$dir\WordCounter.exe" -PassThru
          Start-Sleep -Seconds 8
          # exactly what the Update button runs
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/FORCECLOSEAPPLICATIONS","/RESTARTAPP=1" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "update install did not finish" }
          "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 6
          $running = Get-Process WordCounter -ErrorAction SilentlyContinue
          "app running again after update: $([bool]$running)"
          if (-not $running) { throw "app did not restart after the update" }
          $running | Stop-Process -Force

      - name: Can the app see the latest release on GitHub (info only)
        continue-on-error: true
        run: |
          python -c "from wordcounter import updater as U; i=U.check_latest('0.0.1'); print('latest release:', i.version, i.installer_name, i.size, 'bytes, sha256:', bool(i.sha256))"
          $global:LASTEXITCODE = 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            selftest-*.txt
            pytest-output.txt
            ci-hear.json
            window.png

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Word Counter ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Output/WordCounter-Setup-*.exe
            window.png
            window-milestone.png
            ci-hear.json
            ci-listen.json
            ci-hear-better.json
            ci-gpu.json
          body: |
            **Download `WordCounter-Setup-${{ steps.ver.outputs.version }}.exe`** and double-click it.
            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't paid-signed).
            **Already have Word Counter 1.1.0 or newer?** Just click the Update button in the app.
            No admin rights needed.

            What's new: ${{ steps.ver.outputs.notes }}
